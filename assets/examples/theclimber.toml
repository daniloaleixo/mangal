# theclimber.club — a single-series site with no catalog to search.
#
# Install with:
#   cp theclimber.toml "$(mangal where --sources)/"
#
# The source will appear as "theclimber".

base_url         = "https://theclimber.club"
reverse_chapters = true          # the site lists newest chapters first

[[manga]]
name  = "The Climber"
url   = "https://theclimber.club/"
cover = "https://theclimber.club/wp-content/uploads/2024/07/The-Climber.jpg"

[chapters]
selector = "#chapters-list-holder a.chapter-list-item"
  [chapters.name]
  selector = "span.chapter-name"
  [chapters.url]
  attr = "href"

[pages]
# Pages are served from more than one CDN host (seen: official.lowee.us and
# scans.lastation.us, varying by chapter), but both share the series path
# segment "/Kokou-No-Hito/". Key on that instead of the host, and resist the
# urge to narrow this to a single hostname — it will break on other chapters.
# If you are adapting this file for a different series, replace
# "/Kokou-No-Hito/" with that series' own CDN path segment.
selector = "p img[src*='/Kokou-No-Hito/']"
  [pages.url]
  attr = "src"
